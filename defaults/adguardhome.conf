# AdGuard Home start options for Entware / Keenetic
# Sourced by /opt/etc/init.d/S99adguardhome via rc.func

# Working directory (where AdGuardHome.yaml lives)
DIR="-w /opt/etc/AdGuardHome"

# Log file
LOG="-l /opt/var/log/AdGuardHome.log"

# PID file
PID="--pidfile /opt/var/run/AdGuardHome.pid"

# Disable update checks (updates come from opkg)
UPD="--no-check-update"

OPTIONS="$DIR $LOG $PID $UPD"
