server.document-root = "/opt/share/www"
server.port          = 91
server.upload-dirs   = ( "/opt/tmp" )
server.modules       = ( "mod_cgi", "mod_rewrite", "mod_setenv" )
server.errorlog      = "/opt/var/log/lighttpd-error.log"

index-file.names = ( "index.php", "index.html" )

include "/opt/etc/lighttpd/mime.conf"
include "/opt/etc/lighttpd/conf.d/*.conf"

# Mirrors the Cache-Control rule of src/etc/lighttpd/conf.d/91-shadowsocks.conf (UI files are
# served from /xray/ here when the shipped block is not installed yet).
$HTTP["url"] =~ "^/(xray/)?(ui/|index\.php$|$)" {
    setenv.add-response-header = ( "Cache-Control" => "no-cache" )
}
