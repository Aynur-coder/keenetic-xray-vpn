name: release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION and check if release already exists
        id: ver
        run: |
          VERSION=$(tr -d ' \r\n' < VERSION)
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Skip if release already exists
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate manifest.json with SHA256
        if: steps.ver.outputs.skip == 'false'
        run: |
          set -e
          python3 - <<'PY'
          import json, hashlib, os, sys
          with open('manifest.template.json') as f:
              tpl = json.load(f)
          ver = open('VERSION').read().strip()
          tpl['version'] = ver
          for item in tpl.get('files', []):
              src = item['src']
              if not os.path.isfile(src):
                  sys.exit(f"Missing file declared in manifest: {src}")
              h = hashlib.sha256(open(src, 'rb').read()).hexdigest()
              item['sha256'] = h
          with open('manifest.json', 'w') as f:
              json.dump(tpl, f, indent=2, sort_keys=False)
          print(f"manifest.json generated for v{ver} with {len(tpl['files'])} hashed files")
          PY

      - name: Extract changelog for this version
        if: steps.ver.outputs.skip == 'false'
        run: |
          set -e
          ver="${{ env.VERSION }}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' changelog.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release v$ver" > release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release with assets
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            manifest.json
            install.sh
            VERSION
